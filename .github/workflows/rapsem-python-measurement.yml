name: RAPSEM Python measurement synthetic checks

on:
  push:
    paths:
      - '02_scripts/20_rapsem_blt2005/**'
      - '.github/workflows/rapsem-python-measurement.yml'
  pull_request:
    paths:
      - '02_scripts/20_rapsem_blt2005/**'
      - '.github/workflows/rapsem-python-measurement.yml'

jobs:
  synthetic-measurement-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RAPSEM preparation requirements
        run: python -m pip install -r 02_scripts/20_rapsem_blt2005/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q 02_scripts/20_rapsem_blt2005
      - name: Run candidate measurement unit tests (synthetic; no IFLS data)
        run: python -m pytest -q 02_scripts/20_rapsem_blt2005/tests
